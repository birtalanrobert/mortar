name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Build first: NodeNext resolves workspace packages through their
      # published exports map, so declarations must exist before typecheck.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r --filter './packages/**' run typecheck

      - name: Test
        run: pnpm test
