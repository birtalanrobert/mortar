# Mortar's own test stack.
#
# Ports 3050/3051 are chosen to sit clear of the defaults (5432, 6379), so
# running these tests can never collide with a database a consuming service is
# already running locally.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mortar-test-postgres
    environment:
      POSTGRES_USER: mortar
      POSTGRES_PASSWORD: mortar
      POSTGRES_DB: mortar_test
    ports:
      - '3050:5432'
    tmpfs:
      # Tests are throwaway; keeping the data in memory makes them
      # substantially faster and guarantees a clean slate on restart.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mortar -d mortar_test']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: mortar-test-redis
    ports:
      - '3051:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    # S3, locally, so `S3Storage` is tested against something that speaks the
    # protocol rather than against a mock of the SDK. The parts most likely to
    # be wrong — presigned URLs, lifecycle configuration, what a missing object
    # answers — are exactly the parts a mock cannot tell you about.
    image: minio/minio:latest
    container_name: mortar-test-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: mortar
      MINIO_ROOT_PASSWORD: mortar-local-secret
    ports:
      - '3052:9000'
      - '3053:9001'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15
